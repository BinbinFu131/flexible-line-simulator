<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>柔性产线模拟器</title>
    <meta
      name="description"
      content="面向柔性机器人产线的浏览器数字孪生演示。"
    >
    <meta property="og:title" content="柔性产线模拟器">
    <meta property="og:description" content="面向柔性机器人产线的浏览器数字孪生演示。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://binbinfu131.github.io/flexible-line-simulator/zh-cn.html">
    <link rel="alternate" hreflang="en" href="https://binbinfu131.github.io/flexible-line-simulator/">
    <link rel="alternate" hreflang="zh-CN" href="https://binbinfu131.github.io/flexible-line-simulator/zh-cn.html">
    <link rel="alternate" hreflang="x-default" href="https://binbinfu131.github.io/flexible-line-simulator/">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232457c5'/%3E%3Crect x='10' y='40' width='44' height='8' rx='4' fill='%23ffffff'/%3E%3Ccircle cx='22' cy='26' r='8' fill='%230b8a86' stroke='%23ffffff' stroke-width='3'/%3E%3Crect x='36' y='16' width='16' height='16' rx='3' fill='%23ffffff'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar" aria-label="生产控制">
        <div class="brand-block">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <h1>柔性产线模拟器</h1>
            <p>机器人单元、输送流转、视觉检测与双工艺调度。</p>
          </div>
        </div>

        <div class="control-cluster">
          <a class="language-link" href="index.html">English</a>

          <fieldset class="segmented" aria-label="工艺模式">
            <legend>模式</legend>
            <button class="segment active" type="button" data-mode="pcb">PCB</button>
            <button class="segment" type="button" data-mode="frame">手机中框</button>
          </fieldset>

          <div class="control-buttons">
            <button class="tool-button primary" type="button" id="toggleRun" aria-label="暂停产线">
              <span class="button-icon" aria-hidden="true">||</span>
              <span>暂停</span>
            </button>
            <button class="tool-button" type="button" id="resetLine" aria-label="重置产线">
              <span class="button-icon" aria-hidden="true">R</span>
              <span>重置</span>
            </button>
            <button class="tool-button warning" type="button" id="injectFault" aria-label="注入产线故障">
              <span class="button-icon" aria-hidden="true">!</span>
              <span>故障</span>
            </button>
          </div>
        </div>
      </section>

      <section class="workspace">
        <div class="digital-twin-panel">
          <div class="panel-head">
            <div>
              <h2 id="lineTitle">PCB 柔性装配单元</h2>
              <p id="lineSubtitle">自动上料、光学对位、机器人转运与测试分流。</p>
            </div>
            <label class="speed-control" for="speedRange">
              <span>产线速度</span>
              <input id="speedRange" type="range" min="0.5" max="2.5" value="1" step="0.25">
            </label>
          </div>
          <canvas id="lineCanvas" width="1280" height="720" aria-label="动态产线仿真画布"></canvas>
        </div>

        <aside class="side-panel" aria-label="产线看板">
          <section class="status-strip">
            <div class="status-card">
              <span class="metric-label">产量</span>
              <strong id="metricOutput">0</strong>
              <span class="metric-sub">今日工件数</span>
            </div>
            <div class="status-card">
              <span class="metric-label">良率</span>
              <strong id="metricYield">99.1%</strong>
              <span class="metric-sub">滚动统计</span>
            </div>
            <div class="status-card">
              <span class="metric-label">节拍</span>
              <strong id="metricCycle">7.6s</strong>
              <span class="metric-sub">目标节拍</span>
            </div>
            <div class="status-card">
              <span class="metric-label">OEE</span>
              <strong id="metricOee">87%</strong>
              <span class="metric-sub">仿真数据</span>
            </div>
          </section>

          <section class="process-card">
            <div class="section-head">
              <h2>工艺路线</h2>
              <span id="activeRecipe">PCB-A12</span>
            </div>
            <ol class="route-list" id="routeList"></ol>
          </section>

          <section class="process-card">
            <div class="section-head">
              <h2>工位状态</h2>
              <span id="stationSummary">5 个工位在线</span>
            </div>
            <div class="station-grid" id="stationGrid"></div>
          </section>

          <section class="process-card log-card">
            <div class="section-head">
              <h2>事件日志</h2>
              <span id="clockReadout">00:00:00</span>
            </div>
            <ul class="event-log" id="eventLog"></ul>
          </section>
        </aside>
      </section>

      <footer class="page-foot">
        <p>
          教学用前端仿真演示（作品集项目），并非真实工业控制系统，不涉及任何真实设备、厂商或生产数据。
          <a href="https://github.com/BinbinFu131/flexible-line-simulator">GitHub 源码</a>
        </p>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
